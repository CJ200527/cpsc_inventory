<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CPSC Inventory - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #d6f1fe; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #ffffff; padding: 35px 40px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { font-size: 22px; text-align: center; margin-bottom: 6px; color: #000; }
        p.sub { font-size: 12px; color: #666; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        label { font-size: 12px; font-weight: 500; color: #333; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 9px 12px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; outline: none; }
        input:focus { border-color: #53c5f1; background: #fff; }
        .btn-primary { width: 100%; padding: 10px; background: #53c5f1; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background: #3bb2e0; }
        .back-link { display: block; text-align: center; font-size: 12px; color: #0277bd; margin-top: 15px; text-decoration: none; }
        .alert { font-size: 12px; padding: 8px; border-radius: 4px; margin-bottom: 12px; text-align: center; }
        .alert-error { background: #fdf7f7; color: #d9534f; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p class="sub">Verify your account information</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/forgot_password">
            <div class="input-group">
                <label>User Name:</label>
                <input type="text" name="username" required autocomplete="off">
            </div>

            <div class="input-group">
                <label>Registered Contact Number:</label>
                <input type="tel" name="contact_number" pattern="^09[0-9]{9}$" maxlength="11" placeholder="09351234567" required autocomplete="off">
            </div>

            <div class="input-group">
                <label>New Password:</label>
                <input type="password" name="new_password" required>
            </div>

            <button type="submit" class="btn-primary">Update Password</button>
        </form>

        <a href="/login" class="back-link">← Back to Sign In</a>
    </div>
</body>
</html>
